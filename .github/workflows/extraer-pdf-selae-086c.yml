
name: LotoScan - Extraer PDF SELAE 0.86C

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install beautifulsoup4==4.12.3 pypdf==5.4.0

      - name: Ejecutar extracción 0.86C
        run: python scripts/extraer_pdf_selae_086c.py

      - name: Guardar diagnóstico y textos completos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-pdf-086c
          path: |
            informe_pdf_086c.json
            informe_pdf_086c.txt
            diagnostico_pdf_086c/
          if-no-files-found: error
          retention-days: 14
