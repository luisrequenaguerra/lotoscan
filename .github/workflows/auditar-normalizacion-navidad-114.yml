name: LotoScan - Normalizacion de paginas Navidad 1.14
on:
  workflow_dispatch:
    inputs:
      anio:
        description: 'Ano del sorteo (2024, 2025 o futuro)'
        required: true
        default: '2024'
        type: string
      pdf_url:
        description: 'URL HTTPS oficial SELAE para un ano nuevo (vacio para historicos)'
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar PyMuPDF
        run: python -m pip install 'PyMuPDF==1.26.6'
      - name: Auditar PDF
        env:
          ANIO: ${{ inputs.anio }}
          PDF_URL: ${{ inputs.pdf_url }}
        run: |
          if [ -n "$PDF_URL" ]; then
            python scripts/auditar_normalizacion_navidad_114.py --anio "$ANIO" --url "$PDF_URL"
          else
            python scripts/auditar_normalizacion_navidad_114.py --historico "$ANIO"
          fi
      - name: Subir informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-114
          path: salida_114/
          if-no-files-found: warn
