name: LotoScan - Integracion economica experimental Navidad 1.17
on:
  workflow_dispatch:
    inputs:
      anio:
        description: "Año 2024 o 2025; para otros años proporcionar pdf_url"
        required: true
        default: "2024"
        type: string
      pdf_url:
        description: "URL HTTPS oficial SELAE (opcional)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar PyMuPDF
        run: python -m pip install 'PyMuPDF>=1.24,<1.28'
      - name: Ejecutar auditoria 1.17
        env:
          YEAR: ${{ inputs.anio }}
          PDF_URL: ${{ inputs.pdf_url }}
        run: |
          if [ -n "$PDF_URL" ]; then
            python scripts/auditar_integracion_navidad_117.py --anio "$YEAR" --url "$PDF_URL"
          else
            python scripts/auditar_integracion_navidad_117.py --historico "$YEAR"
          fi
      - name: Publicar informes de auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-117-${{ inputs.anio }}
          path: salida_117/
          if-no-files-found: warn
