name: LotoScan - Integracion de todas las categorias
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/test_integracion_categorias.py'
      - '.github/workflows/integracion-categorias.yml'
      - 'datos/lotoscan/historico_oficial/**/actual.json'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probar categorias con historico oficial
        run: python -m unittest discover -s tests -p 'test_*.py' -v
