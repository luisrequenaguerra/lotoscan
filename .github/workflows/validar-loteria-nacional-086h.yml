name: LotoScan - Validar Loteria Nacional PDF 0.86H
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install beautifulsoup4==4.12.3 pypdf==5.4.0
      - name: Auditar Loteria Nacional
        run: python scripts/validar_loteria_nacional_086h.py
      - name: Guardar informes y texto completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-nacional-086h
          path: |
            informe_pdf_086h.json
            informe_pdf_086h.txt
            diagnostico_pdf_086h/
          if-no-files-found: error
          retention-days: 14
