name: LotoScan - Conservar cuatro juegos 0.60
'on':
  workflow_dispatch:
  schedule:
    # UTC: consultas frecuentes tras los sorteos, sin asumir publicación instantánea.
    - cron: '12,27,42,57 16-23 * * *'
    - cron: '12,27,42,57 0-1 * * *'
    - cron: '22 5,9,13 * * *'
permissions:
  contents: write
concurrency:
  group: lotoscan-historicos-escritura-069
  cancel-in-progress: false
jobs:
  conservar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unificar históricos existentes
        run: python scripts/unificar_historicos_069.py
      - name: Extraer combinaciones actuales
        run: python scripts/extraer_combinaciones_059.py
      - name: Conservar en histórico único
        run: python scripts/conservar_cuatro_juegos_060.py
      - name: Guardar cambios en histórico único
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- datos_revision/historico.json
          if ! git diff --cached --quiet; then
            git commit -m "LotoScan 0.60: conservar sorteos en revision"
            git push
          else
            echo "Sin sorteos nuevos"
          fi
      - name: Adjuntar informe y archivo de revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-lotoscan-060
          path: |
            informe-lotoscan-059.json
            datos_revision/historico.json
          if-no-files-found: warn
