name: LotoScan - Unificar resultados PDF SELAE 0.86F

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install beautifulsoup4==4.12.3 pypdf==5.4.0
      - name: Unificar resultados y comprobar integridad
        run: python scripts/extraer_pdf_selae_086f.py
      - name: Guardar informe y textos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-pdf-086f
          path: |
            informe_pdf_086f.json
            informe_pdf_086f.txt
            diagnostico_pdf_086f/
          if-no-files-found: error
          retention-days: 14
