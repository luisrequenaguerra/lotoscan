name: LotoScan - Integrar categorias y premios 0.87N
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrar clasificación y motores en modo simulación
        run: python3 scripts/integrar_premios_087n.py
      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-087n
          path: |
            informe_premios_087n.json
            informe_premios_087n.txt
          if-no-files-found: warn
          retention-days: 14
