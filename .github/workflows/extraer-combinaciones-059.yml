
name: LotoScan - Extraer combinaciones 0.59
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extraer combinaciones sin modificar historico
        run: python scripts/extraer_combinaciones_059.py
      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-lotoscan-059
          path: informe-lotoscan-059.json
          if-no-files-found: warn

