name: LotoScan - Descubrir PDF SELAE 0.87A
on:
  workflow_dispatch:
    inputs:
      verificar_pdf:
        description: 'Descargar candidatos y comprobar que son PDF reales (solo diagnostico)'
        type: boolean
        default: true
        required: false
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Buscar notas oficiales
        env:
          VERIFICAR: ${{ inputs.verificar_pdf }}
        run: |
          if [ "$VERIFICAR" = "true" ]; then
            python scripts/descubrir_pdf_selae_087a.py --verificar
          else
            python scripts/descubrir_pdf_selae_087a.py
          fi
      - name: Subir diagnostico (incluso si hay errores)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-087a
          path: diagnostico_selae_087a/
          if-no-files-found: warn
          retention-days: 14
