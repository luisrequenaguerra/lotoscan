name: LotoScan - Normalizar historico SELAE 1.31
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["LotoScan - Historico oficial 10 juegos 1.30.1"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: lotoscan-normalizacion
  cancel-in-progress: false
jobs:
  normalizar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Normalizar histórico archivado
        run: python scripts/normalizar_resultados_131.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lotoscan-selae-131
          path: salida_131/
          if-no-files-found: warn
      - name: Guardar resultados normalizados
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datos/lotoscan/resultados_normalizados/
          if ! git diff --cached --quiet; then
            git commit -m 'LotoScan: normalizar resultados oficiales 1.31'
            git pull --rebase
            git push
          fi
