
name: LotoScan - Diagnosticar fuentes oficiales
on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * *'
permissions:
  contents: read
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar fuentes sin publicar datos
        run: python scripts/probar_fuentes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-fuentes
          path: diagnostico-fuentes.json
          if-no-files-found: warn

