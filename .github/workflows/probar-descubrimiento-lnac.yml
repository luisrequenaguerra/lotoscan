name: Probar descubrimiento persistente LNAC
on:
  push:
    branches: ['investigacion/lnac-automatizacion-extraordinarios']
    paths: ['scripts/descubrir_calendario_lnac.py','.github/workflows/probar-descubrimiento-lnac.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/descubrir_calendario_lnac.py --self-test
      - run: python3 scripts/descubrir_calendario_lnac.py --registro /tmp/calendario.json --guardar
      - uses: actions/upload-artifact@v4
        with:
          name: calendario-lnac-prueba
          path: /tmp/calendario.json
