
name: LotoScan - Extraccion exploratoria 0.56
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extraer datos brutos sin modificar historico
        run: python scripts/extraer_cuatro_juegos_prueba.py
      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-lotoscan-056
          path: informe-lotoscan-056.json
          if-no-files-found: warn

