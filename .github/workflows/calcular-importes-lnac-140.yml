name: LotoScan - Auditoria importes LNAC 1.40
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/calcular_importes_lnac_140.py'
      - '.github/workflows/calcular-importes-lnac-140.yml'
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Auditar importes de LNAC
        run: python scripts/calcular_importes_lnac_140.py --informe salida_140
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lotoscan-selae-140
          path: salida_140/
