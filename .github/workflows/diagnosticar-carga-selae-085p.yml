
name: LotoScan - Investigar carga SELAE 0.85P
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencia
        run: python3 -m pip install beautifulsoup4==4.12.3
      - name: Investigar carga dinamica sin publicar
        run: python3 scripts/diagnosticar_carga_selae_085p.py
      - name: Adjuntar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-085p
          path: |
            informe_selae_085p.json
            informe_selae_085p.txt
          if-no-files-found: warn
          retention-days: 14
