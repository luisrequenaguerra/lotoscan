name: LotoScan - Joker Anexo II y resguardos
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/premios_joker_millon.py'
      - 'scripts/verificar_resguardo_asociado.py'
      - 'tests/test_premios_joker_millon.py'
      - 'tests/test_resguardos_asociados.py'
      - '.github/workflows/validar-joker-anexo-resguardos.yml'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar tabla oficial y todas las regresiones
        run: python -m unittest discover -s tests -p 'test_*.py' -v
