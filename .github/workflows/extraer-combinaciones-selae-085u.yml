
name: LotoScan - Investigar combinaciones SELAE 0.85U
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar analizador HTML
        run: python -m pip install beautifulsoup4==4.12.3
      - name: Inspeccionar combinaciones sin publicar
        run: python scripts/extraer_combinaciones_selae_085u.py
      - name: Adjuntar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-085u
          path: |
            informe_selae_085u.json
            informe_selae_085u.txt
          if-no-files-found: error
          retention-days: 14
