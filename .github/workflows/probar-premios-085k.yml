
name: LotoScan - Contrastar premios 0.85K
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: python3 -m pip install beautifulsoup4==4.12.3
      - name: Contrastar premios sin publicar
        run: python3 scripts/validar_premios_085k.py
      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-premios-085k
          path: |
            informe_premios_085k.json
            informe_premios_085k.txt
          if-no-files-found: warn
          retention-days: 14
