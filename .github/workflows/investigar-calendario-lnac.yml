name: Investigar calendario futuro LNAC
on:
  push:
    branches: ['investigacion/lnac-automatizacion-extraordinarios']
    paths: ['.github/workflows/investigar-calendario-lnac.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Consultas acotadas sin publicación
        run: |
          PYTHONPATH=scripts python3 - <<'PY'
          import json,time,pathlib,datetime,re
          from zoneinfo import ZoneInfo
          from actualizar_resultados_130 import BASE,fetch
          out=pathlib.Path('salida_calendario_lnac');out.mkdir(exist_ok=True)
          rows=[]
          def probe(label,url):
              raw,net=fetch(url,retries=0)
              row={'label':label,'url':url,**net}
              obj=None
              if raw:
                  try:
                      obj=json.loads(raw)
                      (out/(label+'.json')).write_bytes(raw)
                      row['json']=True
                      items=obj if isinstance(obj,list) else [obj]
                      keys=('drawIdSorteo','drawIdSorteoSiguiente','fechaSorteo','modelDraw','nombreDelSorteo','precioDecimo','id_sorteo','fecha_sorteo','tenthPrice','game_id')
                      row['items']=[{k:x[k] for k in keys if k in x} for x in items[:10] if isinstance(x,dict)]
                  except ValueError: row['json']=False
              rows.append(row)
              print(json.dumps(row,ensure_ascii=False),flush=True)
              (out/'informe.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
              time.sleep(8)
              return obj
          latest=probe('ultimo',BASE+'resultados1')
          if isinstance(latest,dict):
              sid=str(latest.get('drawIdSorteoSiguiente') or '')
              if re.fullmatch(r'[0-9]{6,20}',sid):
                  probe('siguiente_id',BASE+'resultados2?idsorteo='+sid)
          today=datetime.datetime.now(ZoneInfo('Europe/Madrid')).date()
          future=[today+datetime.timedelta(days=i) for i in range(1,8) if (today+datetime.timedelta(days=i)).weekday() in (3,5)]
          for day in future[:2]:
              for endpoint in ('fecha2','fechav2','fechav3'):
                  probe(endpoint+'_'+day.isoformat(),BASE+endpoint+'?game_id=LNAC&fecha_sorteo='+day.strftime('%Y%m%d'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendario-lnac-diagnostico
          path: salida_calendario_lnac/
