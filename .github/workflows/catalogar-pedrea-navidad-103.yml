name: LotoScan - Catalogar pedrea Navidad 1.03
on:
  workflow_dispatch:
jobs:
  catalogo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar lector PDF
        run: python -m pip install 'PyMuPDF==1.26.5'
      - name: Catalogar y auditar premios navideños
        run: python scripts/catalogar_pedrea_navidad_103.py --salida salida_lotoscan_103
      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-103
          path: salida_lotoscan_103/
          if-no-files-found: warn
