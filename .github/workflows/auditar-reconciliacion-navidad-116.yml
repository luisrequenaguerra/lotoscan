name: LotoScan - Reconciliacion integral Navidad 1.16
on:
  workflow_dispatch:
    inputs:
      anio:
        description: "Año histórico 2024 o 2025; para otro año, indicar pdf_url"
        required: true
        default: "2024"
        type: string
      pdf_url:
        description: "URL HTTPS oficial SELAE (opcional)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar lector PDF
        run: python -m pip install 'PyMuPDF>=1.24,<1.28'
      - name: Ejecutar auditoria
        env:
          YEAR: ${{ inputs.anio }}
          PDF_URL: ${{ inputs.pdf_url }}
        run: |
          if [ -n "$PDF_URL" ]; then
            python scripts/auditar_reconciliacion_navidad_116.py --anio "$YEAR" --url "$PDF_URL"
          else
            python scripts/auditar_reconciliacion_navidad_116.py --historico "$YEAR"
          fi
      - name: Subir informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-116
          path: salida_116/
          if-no-files-found: warn
