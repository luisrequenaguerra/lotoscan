name: LotoScan - Pruebas positivas y negativas 1.34
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Comprobar apuestas y rechazos contra resultados normalizados
        run: python scripts/comprobar_boletos_134.py --informe salida_134
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lotoscan-selae-134
          path: salida_134/
          if-no-files-found: warn
