name: Inspeccionar servicio terceros LNAC
on:
  push:
    branches: ['investigacion/lnac-fechav2']
    paths: ['.github/workflows/inspeccionar-terceros-lnac.yml']
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, re, pathlib, time
          from html.parser import HTMLParser
          out=pathlib.Path('inspeccion-lnac');out.mkdir()
          base='https://www.loteriasyapuestas.es'
          url=base+'/f/loterias/resultados/lnac.html?game_id=LNAC&fecha_sorteo=20261121'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  print('HTTP',r.status,r.url,flush=True)
                  return r.read(2000000).decode('utf-8',errors='replace')
          class Parser(HTMLParser):
              def __init__(self): super().__init__();self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='script' and dict(attrs).get('src'):self.scripts.append(dict(attrs)['src'])
          try:
              html=get(url);(out/'lnac.html').write_text(html)
              p=Parser();p.feed(html)
              print('SCRIPTS',p.scripts,flush=True)
              for i,src in enumerate(p.scripts[:15]):
                  u=urllib.parse.urljoin(url,src)
                  if urllib.parse.urlparse(u).hostname!='www.loteriasyapuestas.es':continue
                  time.sleep(3)
                  try:
                      js=get(u);(out/f'{i}.js').write_text(js)
                      for m in list(re.finditer(r'(?i)servicios/|fechav[0-9]+|fecha2|resultados[12]|game_id|fecha_sorteo',js))[:35]:
                          print('MATCH',u,js[max(0,m.start()-100):m.end()+120].replace('\n',' '),flush=True)
                  except Exception as e: print('ERROR JS',u,e,flush=True)
          except Exception as e: print('ERROR HTML',e,flush=True);raise
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspeccion-terceros-lnac
          path: inspeccion-lnac/
