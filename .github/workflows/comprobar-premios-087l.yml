name: LotoScan - Pruebas de premios 0.87L
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar apuestas sintéticas con histórico oficial
        run: python3 scripts/comprobar_premios_087l.py
      - name: Guardar informe incluso si hay errores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-087l
          path: |
            informe_premios_087l.json
            informe_premios_087l.txt
          if-no-files-found: warn
          retention-days: 14
