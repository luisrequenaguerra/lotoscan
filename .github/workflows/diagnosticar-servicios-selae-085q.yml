
name: LotoScan - Investigar servicios SELAE 0.85Q
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencia
        run: python3 -m pip install beautifulsoup4==4.12.3
      - name: Investigar servicios sin publicar
        run: python3 scripts/diagnosticar_servicios_selae_085q.py
      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-085q
          path: |
            informe_selae_085q.json
            informe_selae_085q.txt
          if-no-files-found: warn
          retention-days: 14
