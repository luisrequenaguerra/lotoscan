name: LotoScan - Auditoria acumulaciones Navidad 1.09
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Auditar acumulaciones historicas sin red
        run: python scripts/auditar_acumulaciones_navidad_109.py
      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-109
          path: salida_109/
          if-no-files-found: warn
