
name: LotoScan - Explorar fuentes hipicas 0.85J
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Instalar analizador HTML
        run: python3 -m pip install beautifulsoup4==4.12.3
      - name: Explorar fuentes sin publicar
        run: python3 scripts/explorar_hipicos_085j.py
      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-hipicos-085j
          path: |
            informe_hipicos_085j.json
            informe_hipicos_085j.txt
          if-no-files-found: warn
          retention-days: 14
