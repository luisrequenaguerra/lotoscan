name: LotoScan - Investigar historicos Nacional 0.87X
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  investigar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consultar identificadores oficiales SELAE
        run: python scripts/investigar_historicos_lnac_087x.py
      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-087x
          path: informes/087x/
          if-no-files-found: warn
