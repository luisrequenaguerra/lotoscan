name: LotoScan - Pruebas de apuestas 1.33
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Comprobar apuestas de control contra historico normalizado
        run: python scripts/comprobar_boletos_133.py --informe salida_133
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lotoscan-selae-133
          path: salida_133/
          if-no-files-found: warn
