name: LotoScan - Total bruto de resguardos
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/calcular_resguardo.py'
      - 'tests/test_calcular_resguardo.py'
      - '.github/workflows/validar-total-resguardos.yml'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ejecutar pruebas y regresiones
        run: python -m unittest discover -s tests -p 'test_*.py' -v
