
name: LotoScan - Diagnosticar premios 0.85I
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: python3 -m pip install beautifulsoup4==4.12.3
      - name: Analizar premios sin publicar
        run: python3 scripts/aislar_premios_085i.py
      - name: Subir informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-premios-085i
          path: |
            informe_premios_085i.json
            informe_premios_085i.txt
          if-no-files-found: warn
          retention-days: 14
