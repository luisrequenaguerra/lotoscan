name: LotoScan - Prueba historica Lototurf y Quintuple Plus 0.87O2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar resultados hipicos oficiales sin publicar
        run: python3 scripts/probar_hipica_historica_087o2.py
      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-087o2
          path: |
            informe_hipica_087o2.json
            informe_hipica_087o2.txt
          if-no-files-found: warn
          retention-days: 14
