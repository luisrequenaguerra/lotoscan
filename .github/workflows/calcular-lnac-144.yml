name: LotoScan - Auditoria premios LNAC 1.44 JSON
on:
  workflow_dispatch:
    inputs:
      numero:
        description: 'Numero de decimo (5 cifras, opcional)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  calcular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Calcular y auditar
        env:
          NUMERO: ${{ inputs.numero }}
        run: |
          if [ -n "$NUMERO" ]; then
            python scripts/calcular_lnac_144.py --numero "$NUMERO" --informe salida_144
          else
            python scripts/calcular_lnac_144.py --informe salida_144
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lotoscan-selae-144
          path: salida_144/
