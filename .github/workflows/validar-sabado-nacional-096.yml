name: LotoScan - Validar sabado Nacional 0.96
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-sabado:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Contrastar importes del sabado con lista oficial
        run: python scripts/validar_sabado_nacional_096.py
      - name: Descargar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-096
          path: informes/lnac_096/validacion_sabado_096.json
          if-no-files-found: warn
