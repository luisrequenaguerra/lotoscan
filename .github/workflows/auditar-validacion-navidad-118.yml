name: LotoScan - Auditoria independiente Navidad 1.18
on:
  workflow_dispatch:
    inputs:
      anio:
        description: "Año del sorteo (2024, 2025, 2026...)"
        required: true
        default: "2024"
        type: string
      pdf_url:
        description: "URL HTTPS PDF oficial; vacío usa PDF histórico 2024/2025"
        required: false
        type: string
      json_url:
        description: "URL HTTPS de JSON oficial NORMALIZADO por número (opcional)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar PyMuPDF
        run: python -m pip install 'PyMuPDF>=1.24,<1.28'
      - name: Ejecutar auditoria 1.18
        env:
          YEAR: ${{ inputs.anio }}
          PDF_URL: ${{ inputs.pdf_url }}
          JSON_URL: ${{ inputs.json_url }}
        run: |
          args=(--anio "$YEAR")
          if [ -n "$PDF_URL" ]; then args+=(--pdf-url "$PDF_URL"); fi
          if [ -n "$JSON_URL" ]; then args+=(--json-url "$JSON_URL"); fi
          python scripts/auditar_validacion_navidad_118.py "${args[@]}"
      - name: Publicar auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-118-${{ inputs.anio }}
          path: salida_118/
          if-no-files-found: warn
