name: LotoScan - Validar Quiniela 0.86L
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar pypdf
        run: python -m pip install pypdf==5.4.0
      - name: Validar notas de La Quiniela
        run: python scripts/validar_quiniela_086l.py --pdf-dir datos/quiniela
      - name: Subir informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-quiniela-086l
          path: informe_quiniela_086l.json
          if-no-files-found: warn
          retention-days: 14
