name: Validar Balance
on:
  push:
    branches: [mejora/balance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          for test in tests/test_*.js; do
            echo "$test"
            node "$test" || exit 1
          done
