name: LotoScan - Auditoria reglas LNAC 1.39
on:
  workflow_dispatch:
    inputs:
      numero:
        description: 'Decimo opcional (5 cifras)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Auditar reglas candidatas sin certificar premios
        env:
          NUMERO: ${{ inputs.numero }}
        run: |
          if [ -n "$NUMERO" ]; then
            python scripts/auditar_premios_lnac_139.py --informe salida_139 --numero "$NUMERO"
          else
            python scripts/auditar_premios_lnac_139.py --informe salida_139
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lotoscan-selae-139
          path: salida_139/
