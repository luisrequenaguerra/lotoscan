name: LotoScan - Calibrar premios Nacional 0.90
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibrar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Analizar importes y coincidencias sin publicar premios
        run: python scripts/calibrar_premios_nacional_090.py
      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-090
          path: informes/lnac_090/calibracion.json
          if-no-files-found: warn
