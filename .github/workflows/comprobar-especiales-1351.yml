name: LotoScan - Loteria Nacional y Quintuple Plus 1.35.1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar reglas especiales con historico oficial
        run: python scripts/comprobar_especiales_1351.py --informe salida_1351
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lotoscan-selae-1351
          path: salida_1351/
          if-no-files-found: warn
