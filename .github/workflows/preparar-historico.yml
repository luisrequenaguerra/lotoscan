
name: LotoScan - Preparar historico 0.49 (prueba)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtener informe de monitor 0.48
        run: python scripts/monitor_resultados.py
      - name: Construir almacen en revision
        run: python scripts/almacenar_resultados.py
      - name: Descargar informe y almacen para revision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-lotoscan-049
          path: |
            informe-lotoscan-048.json
            informe-lotoscan-049.json
            datos_revision/historico.json
          if-no-files-found: warn
          retention-days: 14

