name: LotoScan - Reglas de acumulacion
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/reglas_acumulacion.py'
      - 'tests/test_reglas_acumulacion.py'
      - '.github/workflows/validar-reglas-acumulacion.yml'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pruebas completas
        run: python -m unittest discover -s tests -p 'test_*.py' -v
