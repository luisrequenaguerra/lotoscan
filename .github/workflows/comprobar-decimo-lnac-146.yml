name: LotoScan - Consultar decimo LNAC 1.46
on:
  workflow_dispatch:
    inputs:
      numero:
        description: 'Numero del decimo (5 cifras; vacio para auditoria)'
        required: false
        type: string
      sorteo:
        description: 'ID de sorteo del historico (obligatorio si se introduce numero)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consultar decimo y verificar controles de regresion
        env:
          NUMERO: ${{ inputs.numero }}
          SORTEO: ${{ inputs.sorteo }}
        run: |
          if [ -n "$NUMERO" ]; then
            python scripts/comprobar_decimo_lnac_146.py --numero "$NUMERO" --sorteo "$SORTEO" --informe salida_146
          else
            python scripts/comprobar_decimo_lnac_146.py --informe salida_146
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lotoscan-selae-146
          path: salida_146/
