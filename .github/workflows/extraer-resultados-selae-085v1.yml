
name: LotoScan - Extraer resultados SELAE 0.85V.1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar analizador
        run: python -m pip install beautifulsoup4==4.12.3
      - name: Extraer resultados candidatos sin publicar
        run: python scripts/extraer_resultados_selae_085v1.py
      - name: Adjuntar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-085v1
          path: |
            informe_selae_085v1.json
            informe_selae_085v1.txt
          if-no-files-found: error
          retention-days: 14
