name: Rastrear web Navidad 108
on:
  push:
    branches: ['investigacion/lnac-navidad']
    paths: ['.github/workflows/rastrear-web-navidad-108.yml','scripts/rastrear_web_navidad_108.py']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/rastrear_web_navidad_108.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-web-navidad
          path: evidencias-web-navidad/
          retention-days: 90
