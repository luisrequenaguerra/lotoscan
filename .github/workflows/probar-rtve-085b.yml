
name: LotoScan - Diagnosticar RTVE 0.85B
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Buscar páginas de resultados y premios de RTVE
        run: python3 scripts/diagnosticar_rtve_085b.py
      - name: Descargar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-rtve-085b
          path: |
            informe_rtve_085b.json
            informe_rtve_085b.txt
          if-no-files-found: warn
          retention-days: 14
