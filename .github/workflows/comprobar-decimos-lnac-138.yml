name: LotoScan - Coincidencias decimos LNAC 1.38
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Comprobar decimos con historico completo
        run: python scripts/comprobar_decimos_lnac_138.py --informe salida_138
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lotoscan-selae-138
          path: salida_138/
