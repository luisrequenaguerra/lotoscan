name: LotoScan - Publicar resultados oficiales en interfaz
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/exportar_resultados_interfaz.py'
      - 'scripts/normalizar_resultados_selae.py'
      - 'datos/lotoscan/historico_oficial/**'
      - '.github/workflows/publicar-resultados-interfaz.yml'
    branches:
      - main
permissions:
  contents: write
concurrency:
  group: lotoscan-historico-oficial
  cancel-in-progress: false
jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generar contrato JSON de resultados SELAE
        run: python scripts/exportar_resultados_interfaz.py
      - name: Comprobar contrato
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('resultados/selae-interfaz.json')
          data=json.loads(p.read_text())
          assert data['provider']=='SELAE'
          assert all(data['games'][k] for k in ('BONO','LAPR','EMIL'))
          print({k:len(v) for k,v in data['games'].items()})
          PY
      - name: Guardar resultados publicados sin sobrescribir cambios concurrentes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for intento in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/exportar_resultados_interfaz.py
            git add resultados/selae-interfaz.json
            if git diff --cached --quiet; then
              echo "Interfaz ya actualizada"
              exit 0
            fi
            git commit -m "Actualizar resultados SELAE para interfaz"
            if git push origin HEAD:main; then
              echo "Resultados publicados"
              exit 0
            fi
            echo "Publicación concurrente detectada; reintentando ($intento/5)"
            sleep 2
          done
          echo "No se pudo publicar tras cinco intentos" >&2
          exit 1
