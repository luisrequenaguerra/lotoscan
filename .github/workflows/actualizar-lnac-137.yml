name: LotoScan - Historico completo Loteria Nacional 1.37
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lotoscan-lnac-historico
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recuperar ultimos sorteos y guardar extracciones
        run: python scripts/actualizar_lnac_137.py --informe salida_137
      - name: Guardar historico en repositorio
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datos/lotoscan/loteria_nacional/historico_completo/
          if ! git diff --cached --quiet; then
            git commit -m 'LotoScan: actualizar extracciones LNAC 1.37'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lotoscan-selae-137
          path: salida_137/
