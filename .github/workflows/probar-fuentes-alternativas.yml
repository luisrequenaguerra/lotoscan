
name: LotoScan - Probar fuentes alternativas
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnosticar acceso respetando robots.txt
        run: python scripts/probar_fuentes_alternativas.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-alternativas
          path: diagnostico-alternativas.json

