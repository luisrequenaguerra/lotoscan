
name: LotoScan - Diagnostico siete juegos 0.54

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inspeccionar enlaces de la fuente
        run: python scripts/diagnosticar_siete_juegos.py

      - name: Descargar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-lotoscan-054
          path: informe-lotoscan-054.json
          if-no-files-found: warn

