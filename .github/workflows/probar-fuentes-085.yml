name: LotoScan - Probar fuentes 0.85
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar acceso a fuentes desde GitHub Actions
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, json, datetime, os, re
          targets = [
            ('6aciertos resultados', 'https://www.6aciertos.com/resultados/'),
            ('6aciertos portada', 'https://www.6aciertos.com/'),
            ('RTVE loterias', 'https://www.rtve.es/loterias/'),
          ]
          report = {'fecha_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'pruebas': []}
          for name, url in targets:
            item={'nombre':name,'url':url}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; LotoScanSourceCheck/0.85; diagnostic)','Accept':'text/html,application/xhtml+xml'})
              with urllib.request.urlopen(req,timeout=18) as resp:
                body=resp.read(350000).decode('utf-8','replace')
                item.update({'http_status':resp.status,'url_final':resp.url,'content_type':resp.headers.get('Content-Type',''),'bytes_leidos':len(body.encode('utf-8'))})
                for term in ('lototurf','quinigol','quíntuple','quintuple','premios','acertantes'):
                  item['contiene_'+term]=term in body.lower()
                item['titulo_html']=re.search(r'<title[^>]*>(.*?)</title>',body,re.I|re.S).group(1).strip()[:160] if re.search(r'<title[^>]*>(.*?)</title>',body,re.I|re.S) else None
                item['acceso_http_ok']=200<=resp.status<300
            except urllib.error.HTTPError as e:
              item.update({'acceso_http_ok':False,'http_status':e.code,'error':str(e)})
            except Exception as e:
              item.update({'acceso_http_ok':False,'error':type(e).__name__+': '+str(e)})
            report['pruebas'].append(item)
            print(name, json.dumps(item,ensure_ascii=False))
          with open('informe_fuentes_085.json','w',encoding='utf-8') as f:
            json.dump(report,f,ensure_ascii=False,indent=2)
          with open('informe_fuentes_085.txt','w',encoding='utf-8') as f:
            f.write('LotoScan 0.85 - Diagnóstico de accesibilidad desde GitHub Actions\n')
            f.write('HTTP 200 no garantiza extracción estable de resultados ni importes.\n\n')
            for i in report['pruebas']:
              f.write(f"{i['nombre']}: HTTP {i.get('http_status','sin respuesta')}; error={i.get('error','ninguno')}; título={i.get('titulo_html','sin título')}\n")
          PY
      - name: Descargar informe
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-fuentes-085
          path: |
            informe_fuentes_085.json
            informe_fuentes_085.txt
          retention-days: 14
