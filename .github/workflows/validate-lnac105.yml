name: Validate LNAC model 105
on:
  push:
    branches: [investigacion/lnac-modelo105]
    paths:
      - 'scripts/lnac_modelo105.js'
      - 'tests/lnac/modelo105/**'
      - '.github/workflows/validate-lnac105.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/lnac/modelo105/test.js
