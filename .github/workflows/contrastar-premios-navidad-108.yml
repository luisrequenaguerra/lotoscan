name: LotoScan - Contraste premios mayores Navidad 1.08
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar lector PDF
        run: python -m pip install 'PyMuPDF==1.26.6'
      - name: Contrastar bloques de premios mayores con JSON sin red
        run: python scripts/contrastar_premios_navidad_108.py
      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-108
          path: salida_108/
          if-no-files-found: warn
