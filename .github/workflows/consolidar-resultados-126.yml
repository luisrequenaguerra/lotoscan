name: LotoScan - Resultados1 e historico incremental 1.26
on:
  workflow_dispatch:
    inputs:
      solo_lectura:
        description: 'Solo diagnostico, sin actualizar historico'
        type: boolean
        default: false
  schedule:
    - cron: '23 8,14,20 * * *'
permissions:
  contents: write
concurrency:
  group: lotoscan-historico-126
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consultar SELAE resultados1
        env:
          SOLO_LECTURA: ${{ inputs.solo_lectura }}
        run: |
          if [ "$SOLO_LECTURA" = 'true' ]; then
            python scripts/consolidar_resultados_126.py --solo-lectura
          else
            python scripts/consolidar_resultados_126.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lotoscan-selae-126
          path: salida_126/
          if-no-files-found: warn
      - name: Guardar historico en GitHub
        if: ${{ success() && (github.event_name == 'schedule' || inputs.solo_lectura != true) }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datos/lotoscan/historico_126/
          if ! git diff --cached --quiet; then
            git commit -m 'LotoScan: actualizar historico resultados1 1.26'
            git push
          fi
