name: LotoScan - Integracion con sorteos oficiales
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/test_integracion_historico.py'
      - '.github/workflows/integracion-sorteos-oficiales.yml'
      - 'datos/lotoscan/historico_oficial/**/actual.json'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ejecutar todas las pruebas y contrastar archivo oficial
        run: python -m unittest discover -s tests -p 'test_*.py' -v
