name: LotoScan - Extraer reglas Nacional PDF 0.86J
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install beautifulsoup4==4.12.3 pypdf==5.4.0
      - name: Extraer reglas y validar sorteos
        run: python scripts/validar_loteria_nacional_086j.py
      - name: Guardar informes aunque falle validación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-nacional-086j
          path: |
            informe_nacional_086j.json
            informe_nacional_086j.txt
          if-no-files-found: warn
          retention-days: 14
