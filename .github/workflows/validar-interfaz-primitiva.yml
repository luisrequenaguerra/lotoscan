name: Validar interfaz Primitiva
on:
  push:
    paths:
      - 'index.html'
      - 'resultados/selae-interfaz.json'
      - 'tests/test_interfaz_primitiva.js'
      - 'tests/test_interfaz_gordo_eurodreams.js'
      - 'tests/test_interfaz_hipica.js'
      - 'tests/test_interfaz_deportivos.js'
      - 'tests/test_interfaz_elige8.js'
      - 'tests/test_exportador_oficial.py'
      - 'tests/test_premios_historico_real.js'
      - 'tests/test_reintegros_reales.js'
      - 'tests/test_complementarios_reales.js'
      - 'tests/test_euromillones_13_categorias.js'
      - 'scripts/exportar_resultados_interfaz.py'
      - 'scripts/normalizar_resultados_selae.py'
      - 'datos/lotoscan/historico_oficial/**'
      - '.github/workflows/validar-interfaz-primitiva.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'resultados/selae-interfaz.json'
      - 'tests/test_interfaz_primitiva.js'
      - 'tests/test_interfaz_gordo_eurodreams.js'
      - 'tests/test_interfaz_hipica.js'
      - 'tests/test_interfaz_deportivos.js'
      - 'tests/test_interfaz_elige8.js'
      - 'tests/test_exportador_oficial.py'
      - 'tests/test_premios_historico_real.js'
      - 'tests/test_reintegros_reales.js'
      - 'tests/test_complementarios_reales.js'
      - 'tests/test_euromillones_13_categorias.js'
      - 'scripts/exportar_resultados_interfaz.py'
      - 'scripts/normalizar_resultados_selae.py'
      - 'datos/lotoscan/historico_oficial/**'
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_interfaz_primitiva.js
      - run: node tests/test_interfaz_gordo_eurodreams.js
      - run: node tests/test_interfaz_hipica.js
      - run: node tests/test_interfaz_deportivos.js
      - run: node tests/test_interfaz_elige8.js
      - run: python tests/test_exportador_oficial.py
      - run: node tests/test_premios_historico_real.js
      - run: node tests/test_reintegros_reales.js
      - run: node tests/test_complementarios_reales.js
      - run: node tests/test_euromillones_13_categorias.js
