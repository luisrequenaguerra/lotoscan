name: LotoScan - Extraer premios PDF SELAE 0.86D

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install beautifulsoup4==4.12.3 pypdf==5.4.0
      - name: Extraer premios y validar coincidencias
        run: python scripts/extraer_pdf_selae_086d.py
      - name: Subir informe y textos de los PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-pdf-086d
          path: |
            informe_pdf_086d.json
            informe_pdf_086d.txt
            diagnostico_pdf_086d/
          if-no-files-found: error
          retention-days: 14
