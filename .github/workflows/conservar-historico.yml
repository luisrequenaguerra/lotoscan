
name: LotoScan - Conservar historico 0.52
'on':
  workflow_dispatch:
  schedule:
    - cron: '11 0,4,8,12,16 * * *'
    - cron: '11,31,51 18-23 * * *'
permissions:
  contents: write
concurrency:
  group: lotoscan-historico-escritura
  cancel-in-progress: false
jobs:
  conservar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar tres juegos
        run: python scripts/monitor_resultados.py
      - name: Validar y ampliar historico de revision
        run: python scripts/almacenar_resultados.py
      - name: Verificar estructura y estados
        run: python scripts/verificar_persistencia.py
      - name: Conservar historico en GitHub
        run: |
          if git diff --quiet -- datos_revision/historico.json && [ -z "$(git ls-files --others --exclude-standard -- datos_revision/historico.json)" ]; then
            echo "Sin novedades en el historico"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- datos_revision/historico.json
          git commit -m "LotoScan: actualizar historico en revision [skip ci]"
          git push
      - name: Guardar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-lotoscan-052
          path: |
            informe-lotoscan-048.json
            informe-lotoscan-049.json
            informe-lotoscan-050.json
          if-no-files-found: warn
          retention-days: 14

