name: LotoScan - Auditar PDF Navidad 1.02
on:
  workflow_dispatch:
jobs:
  auditoria:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar lector PDF
        run: python -m pip install 'PyMuPDF==1.26.5'
      - name: Auditar PDF oficial de Navidad
        run: python scripts/auditar_pdf_navidad_102.py --salida salida_lotoscan_102
      - name: Publicar informe y evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-102
          path: salida_lotoscan_102/
          if-no-files-found: warn
