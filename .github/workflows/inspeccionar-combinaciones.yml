
name: LotoScan - Inspeccionar combinaciones 0.58
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspeccionar marcado de combinaciones
        run: python scripts/inspeccionar_combinaciones.py
      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-lotoscan-058
          path: informe-lotoscan-058.json
          if-no-files-found: warn

