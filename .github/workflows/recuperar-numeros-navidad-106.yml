name: LotoScan - Recuperar numeros Navidad 1.06
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recuperar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar lectores PDF
        run: |
          python -m pip install 'PyMuPDF==1.26.6'
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Reconciliar numeros omitidos
        run: python scripts/recuperar_numeros_navidad_106.py
      - name: Publicar informe de auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-106
          path: salida_106/
          if-no-files-found: warn
