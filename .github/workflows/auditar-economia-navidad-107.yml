name: LotoScan - Auditoria economica Navidad 1.07
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar lector PDF
        run: python -m pip install 'PyMuPDF==1.26.6'
      - name: Auditar componentes economicos sin consultas externas
        run: python scripts/auditar_economia_navidad_107.py
      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lotoscan-selae-107
          path: salida_107/
          if-no-files-found: warn
